apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-manager-registration
  namespace: test-workload-capi
subjects:
  - kind: ServiceAccount
    name: registration-controller-sa
    namespace: open-cluster-management-hub
roleRef:
  kind: Role
  name: cluster-manager-registration
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-manager-registration
  namespace: test-workload-capi
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
    resourceNames:
      - test-workload-kubeconfig
