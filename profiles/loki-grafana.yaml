apiVersion: config.projectsveltos.io/v1beta1
kind: ClusterProfile
metadata:
  name: observability-loki-grafana
spec:
  clusterSelector:
    matchLabels:
      env: fv

  syncMode: Continuous

  helmCharts:
    - repositoryURL:    https://grafana.github.io/helm-charts
      repositoryName:   grafana
      chartName:        grafana/loki
      chartVersion:     6.49.0
      releaseName:      loki
      releaseNamespace: observability
      helmChartAction:  Install
      values: |
        deploymentMode: SingleBinary

        loki:
          useTestSchema: true
          storage:
            type: filesystem

        singleBinary:
          replicas: 1
          persistence:
            enabled: true
            size: 20Gi

        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0
    - repositoryURL:    https://grafana.github.io/helm-charts
      repositoryName:   grafana
      chartName:        grafana/grafana
      chartVersion:     10.3.1
      releaseName:      grafana
      releaseNamespace: observability
      helmChartAction:  Install
      values: |
        adminPassword: "change-me"

        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Loki
                type: loki
                access: proxy
                url: http://loki:3100
                isDefault: false
