apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ns.yaml
#   - https://github.com/projectsveltos/sveltos.git//kustomize/base?timeout=120&ref=v1.3.1

helmCharts:
  - name: sveltos-dashboard
    includeCRDs: false
    releaseName: sveltos-dashboard
    version: 1.4.0
    namespace: projectsveltos
    repo: https://projectsveltos.github.io/helm-charts
  - name: projectsveltos
    includeCRDs: true
    releaseName: projectsveltos
    version: 1.4.0
    namespace: projectsveltos
    repo: https://projectsveltos.github.io/helm-charts
    valuesInline:
      global:
        capiOnboardAnnotation: "sveltos.io/capi-onboard=true" # disable CAPI onboarding by default

namespace: projectsveltos
